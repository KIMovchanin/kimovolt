name: KIMOVOLT LAB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck & Unit Tests (simulation + content)
        run: |
          npm run typecheck
          npm test

      - name: Build Frontend
        run: npm run build --workspace=frontend

      - name: Go Backend Tests
        working-directory: backend
        run: go test -v ./...

      - name: Build Linux ARM64 Release Binary
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o ../dist/kimovolt-lab-linux-arm64 ./cmd/server
